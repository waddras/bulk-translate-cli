name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what the deployment box runs; 3.12 guards against drift.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check every module imports
        run: python -m compileall -q btcli

      - name: Run tests
        run: python -m pytest

      - name: Check the CLI help renders
        run: |
          for command in probe translate fix update interactive prune; do
            python -m btcli "$command" -h > /dev/null
          done
          python -m btcli -h > /dev/null
